<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#4A121F"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2A9BC"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B33951" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B33951" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B33951" stop-opacity="0"/>
      <stop offset="50%" stop-color="#B33951" stop-opacity="1"/>
      <stop offset="100%" stop-color="#B33951" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#dots)"/>
  <circle cx="960" cy="70" r="220" fill="url(#glow)"/>

  <g transform="translate(48,40)">
    <circle cx="0" cy="0" r="6" fill="#FF5F56"/>
    <circle cx="20" cy="0" r="6" fill="#FFBD2E"/>
    <circle cx="40" cy="0" r="6" fill="#27C93F"/>
    <text x="64" y="5" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="14" fill="#8B949E">~/nimitSharma-03</text>
  </g>

  <text x="48" y="150" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="56" font-weight="700">
    <tspan fill="#B33951">&gt;_ </tspan><tspan fill="url(#titleFill)">Nimit Sharma</tspan>
  </text>

  <rect x="562" y="104" width="14" height="52" fill="#B33951">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <text x="52" y="192" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="20" fill="#9CA3AF">// Software Engineer &#183; Data Science &#183; ML/AI</text>

  <rect x="48" y="218" width="360" height="3" fill="url(#rule)"/>
</svg>
